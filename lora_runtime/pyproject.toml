[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-runtime"
version = "0.1.0"
description = "Zero-latency LoRA switching, RAM-resident adapter cache, multi-LoRA batching, LoRA trees"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "safetensors>=0.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
peft = ["transformers>=4.40", "peft>=0.10"]

[tool.setuptools]
packages = ["lora_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
