[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rolescout"
version = "0.1.0"
description = "Job search that only shows roles that are real, open, and actually at your level."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pydantic>=2.6",
  "anthropic>=1.0",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.40"]

[project.scripts]
rolescout = "rolescout.cli:main"

[tool.setuptools.packages.find]
include = ["rolescout*"]

[tool.setuptools.package-data]
rolescout = ["web/templates/**/*.html", "web/static/*", "seeds/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
