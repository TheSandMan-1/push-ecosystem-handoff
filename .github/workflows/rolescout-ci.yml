name: rolescout-ci
on:
  push:
    paths: ["rolescout/**", ".github/workflows/rolescout-ci.yml"]
  pull_request:
    paths: ["rolescout/**", ".github/workflows/rolescout-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rolescout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: rolescout eval
